<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lord of the Mysteries</title>
  <meta name="description" content="Read Lord of the Mysteries online, in English and Bahasa Indonesia." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    try {
      var s = JSON.parse(localStorage.getItem("lotm.settings") || "{}");
      document.documentElement.dataset.theme = s.theme || "auto";
    } catch (e) {}
  </script>
</head>
<body>
  <header class="bar" id="bar">
    <a href="#/" class="brand" id="brand">Lord of the Mysteries</a>
    <div class="bar-actions">
      <div class="seg" id="lang-switch" role="group" aria-label="Language"></div>
      <button class="icon-btn" id="settings-btn" aria-label="Reading settings" title="Reading settings">Aa</button>
    </div>
  </header>

  <div class="settings" id="settings" hidden>
    <div class="row">
      <span>Theme</span>
      <div class="seg" data-setting="theme">
        <button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="sepia">Sepia</button><button data-v="dark">Dark</button>
      </div>
    </div>
    <div class="row">
      <span>Font</span>
      <div class="seg" data-setting="font">
        <button data-v="serif">Serif</button><button data-v="sans">Sans</button>
      </div>
    </div>
    <div class="row">
      <span>Size</span>
      <div class="seg">
        <button id="size-down" aria-label="Smaller text">A−</button><span class="size-val" id="size-val"></span><button id="size-up" aria-label="Larger text">A+</button>
      </div>
    </div>
    <div class="row">
      <span>Width</span>
      <div class="seg" data-setting="width">
        <button data-v="narrow">Narrow</button><button data-v="normal">Normal</button><button data-v="wide">Wide</button>
      </div>
    </div>
  </div>

  <main id="app"><p class="status">Loading…</p></main>

  <div class="progress" id="progress"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
