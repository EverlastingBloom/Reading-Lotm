<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lord of the Mysteries</title>
  <meta name="description" content="Read Lord of the Mysteries online, in English and Bahasa Indonesia." />
  <meta name="theme-color" content="#f8f6f1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%239b2c2c'/%3E%3Ccircle cx='20' cy='12' r='11' fill='%23f8f6f1'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    try {
      var s = JSON.parse(localStorage.getItem("lotm.settings") || "{}");
      var r = document.documentElement;
      r.dataset.theme = s.theme || "auto";
      r.dataset.font = s.font || "serif";
      r.dataset.width = s.width || "normal";
      r.dataset.leading = s.leading || "normal";
      if (s.size) r.style.setProperty("--reader-size", s.size + "px");
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>

  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <div class="tb-left" id="tb-left"></div>
      <div class="tb-title" id="tb-title"></div>
      <div class="tb-right">
        <div class="seg seg-sm" id="lang-switch" role="group" aria-label="Language"></div>
        <button class="icon-btn" id="toc-btn" type="button" hidden></button>
        <button class="icon-btn" id="settings-btn" type="button"></button>
      </div>
    </div>
  </header>
  <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>

  <main id="app" tabindex="-1"><p class="status">Loading…</p></main>

  <div class="scrim" id="scrim" hidden></div>

  <section class="panel settings" id="settings" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="panel-head">
      <h2 id="settings-title"></h2>
      <button class="icon-btn" type="button" data-close></button>
    </div>
    <div class="panel-body" id="settings-body"></div>
  </section>

  <section class="panel drawer" id="toc" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="toc-title" hidden>
    <div class="panel-head">
      <h2 id="toc-title"></h2>
      <button class="icon-btn" type="button" data-close></button>
    </div>
    <div class="toc-tools" id="toc-tools"></div>
    <div class="toc-list" id="toc-list"></div>
  </section>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
